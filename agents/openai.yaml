interface:
  display_name: "日常照片情绪作品页"
  short_description: "把日常照片重构为真实人物 × 可识别场景插画的 3:4 情绪作品页"
  default_prompt: "使用 $daily-photo-playground，把这张日常照片重构为 3:4 竖版情绪作品页：人物从原照片抠出并保持真实摄影质感、自然肤色与原本服装颜色（禁止插画化、posterize 或为匹配背景改色）；删除完整真实背景，从原照片提取 2–5 个代表性场景元素（海、沙滩、树、草地、山、水面、街道、窗户、玩具等）重绘为简化但可识别的平面场景插画，可用干刷、水粉、粉彩、蜡笔等轻微纹理；几何仅作 0–3 个辅助且必须来自原图场景；暖白或奶油白页面默认保留约 60–80% 连续低信息区与一块完整静区，配一个小型完整原照片窗口和克制的中文编辑排版；环境可以高饱和、艺术化、插画化，但不得污染人物真实色彩；隐藏原照窗口后应仍能判断照片发生的环境。留白不足或场景不可识别时直接重做。"
