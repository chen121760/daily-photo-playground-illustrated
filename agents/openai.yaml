interface:
  display_name: "日常照片情绪作品页"
  short_description: "把日常照片重构为真实人物 × 平面色块 × 极简图标的极简摄影拼贴海报"
  default_prompt: "使用 $daily-photo-playground-illustrated，把这张日常照片重构为 3:4 竖版极简摄影拼贴海报：人物从原照片抠出并保持真实摄影质感、自然肤色与原本服装颜色，外圈加一圈干净的奶油白剪纸描边（禁止插画化、posterize、为匹配背景改色，描边不可变成描摹线/阴影/发光）；不绘制完整场景背景，从原照片提取环境特征压缩为 1–3 个大面积纯色色块或粗笔刷形状（如蓝色海面色块、米黄沙滩色块），场景物件简化成 2–4 个扁平图标（水桶、铲子、叶子、道路曲线等）暗示环境；人物、色块、图标、小缩略图与文字聚成中央视觉岛，不做满版风景；暖白或奶油白页面默认保留约 65–80% 连续低信息区与一块完整静区；保留一个很小（约页面宽度 6–10%）的原照片缩略图；主标题放在人物下方居中、小而克制，可带一行短副标题和一个英文小标签；色块与图标可以高饱和，但不得污染人物真实色彩。禁止水彩风景、完整透视背景、复杂植被、写实背景替换、复古拼贴、撕纸胶带、密集装饰、大标题。留白不足或视觉岛分散时直接重做。"
